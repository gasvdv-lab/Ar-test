<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>AR Kubus 50 cm</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#101010; color:#fff;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
  #ui { position:fixed; z-index:3; inset:0 0 auto 0; padding:16px;
    background:linear-gradient(to bottom, rgba(0,0,0,.78), rgba(0,0,0,0)); pointer-events:none; }
  h1 { margin:0 0 6px; font-size:24px; }
  p { margin:4px 0; max-width:700px; }
  #status { position:fixed; z-index:4; left:50%; bottom:90px; transform:translateX(-50%);
    max-width:calc(100vw - 36px); padding:10px 14px; border-radius:999px; background:rgba(0,0,0,.72);
    text-align:center; font-size:14px; pointer-events:none; }
  #start { position:fixed; z-index:5; left:50%; bottom:24px; transform:translateX(-50%);
    min-width:180px; min-height:52px; padding:0 18px; border:1px solid #666; border-radius:10px;
    background:#fff; color:#111; font-weight:700; font-size:17px; }
  #start:disabled { opacity:.4; }
  canvas { display:block; }
</style>
</head>
<body>
  <div id="ui">
    <h1>AR Kubus — 50 cm</h1>
    <p>Exact 0,50 × 0,50 × 0,50 m.</p>
    <p>Start AR, beweeg rustig over de vloer en tik om de kubus te plaatsen.</p>
  </div>
  <div id="status">WebXR controleren…</div>
  <button id="start" disabled>START AR</button>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start");
const ui = document.getElementById("ui");

let renderer, scene, camera, controller, reticle, cube;
let hitTestSource = null;
let hitTestSourceRequested = false;
let session = null;

async function checkXR() {
  if (!navigator.xr) {
    statusEl.textContent = "WebXR niet beschikbaar.";
    return;
  }
  try {
    const ok = await navigator.xr.isSessionSupported("immersive-ar");
    startBtn.disabled = !ok;
    statusEl.textContent = ok ? "AR beschikbaar. Druk op START AR." : "Immersive AR niet ondersteund.";
  } catch (e) {
    statusEl.textContent = "WebXR-fout: " + e.message;
  }
}

function initThree() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType("local");
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2.3));
  const dl = new THREE.DirectionalLight(0xffffff, 1.4);
  dl.position.set(1, 2, 1);
  scene.add(dl);

  const size = 0.5;
  const geo = new THREE.BoxGeometry(size, size, size);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x1877f2,
    transparent:true,
    opacity:0.78,
    roughness:0.55
  });
  cube = new THREE.Mesh(geo, mat);
  cube.visible = false;
  scene.add(cube);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0xffffff })
  );
  cube.add(edges);

  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.07, 0.095, 48).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color:0xffffff })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  controller = renderer.xr.getController(0);
  controller.addEventListener("select", () => {
    if (!reticle.visible) {
      statusEl.textContent = "Nog geen oppervlak gevonden.";
      return;
    }
    const p = new THREE.Vector3();
    const q = new THREE.Quaternion();
    const s = new THREE.Vector3();
    reticle.matrix.decompose(p,q,s);

    cube.position.copy(p);
    cube.position.y += 0.25; // half of 0.5 m, so bottom rests on surface
    cube.rotation.set(0,0,0);
    cube.visible = true;
    statusEl.textContent = "Kubus geplaatst: 50 × 50 × 50 cm.";
  });
  scene.add(controller);

  renderer.setAnimationLoop((t, frame) => {
    if (frame && session) {
      const refSpace = renderer.xr.getReferenceSpace();

      if (!hitTestSourceRequested) {
        session.requestReferenceSpace("viewer").then(viewerSpace => {
          return session.requestHitTestSource({ space: viewerSpace });
        }).then(source => {
          hitTestSource = source;
        }).catch(err => {
          statusEl.textContent = "Hit-test fout: " + err.message;
        });
        hitTestSourceRequested = true;
      }

      if (hitTestSource) {
        const hits = frame.getHitTestResults(hitTestSource);
        if (hits.length > 0) {
          const pose = hits[0].getPose(refSpace);
          if (pose) {
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            if (!cube.visible) statusEl.textContent = "Oppervlak gevonden. Tik om te plaatsen.";
          }
        } else {
          reticle.visible = false;
          if (!cube.visible) statusEl.textContent = "Beweeg rustig over de vloer…";
        }
      }
    }
    renderer.render(scene, camera);
  });
}

startBtn.addEventListener("click", async () => {
  try {
    if (!renderer) initThree();

    session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test"],
      optionalFeatures: ["local-floor", "dom-overlay"],
      domOverlay: { root: document.body }
    });

    renderer.xr.setSession(session);
    startBtn.style.display = "none";
    ui.style.display = "none";
    statusEl.textContent = "Beweeg rustig over de vloer…";

    session.addEventListener("end", () => {
      session = null;
      hitTestSource = null;
      hitTestSourceRequested = false;
      reticle.visible = false;
      startBtn.style.display = "";
      ui.style.display = "";
      statusEl.textContent = "AR gestopt.";
    }, { once:true });

  } catch (e) {
    statusEl.textContent = e.name + ": " + e.message;
  }
});

addEventListener("resize", () => {
  if (!renderer || !camera) return;
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

checkXR();
</script>
</body>
</html>
