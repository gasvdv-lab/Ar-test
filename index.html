<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>AR Kubus 5 cm — Anchor Placement</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101010;
    color: #fff;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  }
  #ui {
    position: fixed;
    z-index: 3;
    inset: 0 0 auto 0;
    padding: 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,.82), rgba(0,0,0,0));
    pointer-events: none;
  }
  h1 { margin: 0 0 6px; font-size: 23px; }
  p { margin: 4px 0; max-width: 760px; }
  #status {
    position: fixed;
    z-index: 4;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 36px);
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,.76);
    text-align: center;
    font-size: 14px;
    pointer-events: none;
  }
  #start {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    min-width: 180px;
    min-height: 52px;
    padding: 0 18px;
    border: 1px solid #666;
    border-radius: 10px;
    background: #fff;
    color: #111;
    font-weight: 700;
    font-size: 17px;
  }
  #start:disabled { opacity: .4; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="ui">
  <h1>AR Kubus — 5 cm</h1>
  <p>v0.2.2 Anchor Placement</p>
  <p>Tik één keer op een gedetecteerd oppervlak. De app probeert de kubus rechtstreeks aan het hit-testresultaat te ankeren.</p>
</div>

<div id="status">WebXR controleren…</div>
<button id="start" disabled>START AR</button>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const CUBE_SIZE_M = 0.05;

const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start");
const ui = document.getElementById("ui");

let renderer = null;
let scene = null;
let camera = null;
let controller = null;
let reticle = null;
let cubeGroup = null;

let session = null;
let hitTestSource = null;
let hitTestSourceRequested = false;
let lastHitResult = null;

let anchor = null;
let anchorSpace = null;
let placed = false;
let fallbackPose = null;

function setStatus(message) {
  statusEl.textContent = message;
  console.log(message);
}

async function checkXR() {
  if (!navigator.xr) {
    setStatus("WebXR niet beschikbaar.");
    return;
  }
  try {
    const supported = await navigator.xr.isSessionSupported("immersive-ar");
    startBtn.disabled = !supported;
    setStatus(supported ? "AR beschikbaar. Druk op START AR." : "Immersive AR niet ondersteund.");
  } catch (err) {
    setStatus("WebXR-fout: " + err.message);
  }
}

function makeCube() {
  const group = new THREE.Group();

  const geometry = new THREE.BoxGeometry(CUBE_SIZE_M, CUBE_SIZE_M, CUBE_SIZE_M);
  const material = new THREE.MeshStandardMaterial({
    color: 0x1877f2,
    transparent: true,
    opacity: 0.88,
    roughness: 0.5
  });

  const mesh = new THREE.Mesh(geometry, material);
  group.add(mesh);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geometry),
    new THREE.LineBasicMaterial({ color: 0xffffff })
  );
  group.add(edges);

  return group;
}

function initThree() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType("local-floor");
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2.2));
  const directional = new THREE.DirectionalLight(0xffffff, 1.2);
  directional.position.set(1, 2, 1);
  scene.add(directional);

  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.025, 0.035, 48).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  controller = renderer.xr.getController(0);
  controller.addEventListener("select", onSelect);
  scene.add(controller);

  renderer.setAnimationLoop(onFrame);
}

async function onSelect(event) {
  if (placed) {
    setStatus("Kubus staat al geplaatst.");
    return;
  }

  const frame = event.frame;
  const refSpace = renderer.xr.getReferenceSpace();

  // Gebruik indien mogelijk exact het hit-testresultaat van dit frame.
  let hit = null;
  if (frame && hitTestSource) {
    const hits = frame.getHitTestResults(hitTestSource);
    if (hits.length > 0) hit = hits[0];
  }
  if (!hit) hit = lastHitResult;

  if (!hit) {
    setStatus("Geen oppervlak op het moment van tikken.");
    return;
  }

  const pose = hit.getPose(refSpace);
  if (!pose) {
    setStatus("Geen geldige hit-testpose.");
    return;
  }

  cubeGroup = makeCube();
  scene.add(cubeGroup);

  // Fallback positie vanuit de hit-testpose.
  const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
  const p = new THREE.Vector3();
  const q = new THREE.Quaternion();
  const s = new THREE.Vector3();
  m.decompose(p, q, s);

  p.y += CUBE_SIZE_M / 2;

  cubeGroup.position.copy(p);
  cubeGroup.quaternion.identity();
  cubeGroup.visible = true;

  fallbackPose = {
    position: p.clone(),
    quaternion: cubeGroup.quaternion.clone()
  };

  placed = true;
  reticle.visible = false;
  setStatus("Kubus geplaatst. Anchor wordt aangemaakt…");

  // Correcte anchor-methode: rechtstreeks op het hit-testresultaat.
  try {
    if (typeof hit.createAnchor === "function") {
      anchor = await hit.createAnchor();
      if (anchor && anchor.anchorSpace) {
        anchorSpace = anchor.anchorSpace;
        setStatus("GEANKERD — kubus 5 × 5 × 5 cm.");
      } else {
        setStatus("GEEN ANCHOR — standaard tracking blijft actief.");
      }
    } else {
      setStatus("GEEN ANCHOR API — standaard tracking blijft actief.");
    }
  } catch (err) {
    setStatus("ANCHOR MISLUKT — standaard tracking: " + err.message);
  }
}

function updateAnchoredCube(frame, refSpace) {
  if (!cubeGroup || !anchorSpace) return;

  const pose = frame.getPose(anchorSpace, refSpace);
  if (!pose) {
    // Tracking kan tijdelijk wegvallen wanneer camera zicht verliest.
    setStatus("Anchor tijdelijk niet zichtbaar — probeer omgeving opnieuw in beeld te brengen.");
    return;
  }

  const matrix = new THREE.Matrix4().fromArray(pose.transform.matrix);
  const p = new THREE.Vector3();
  const q = new THREE.Quaternion();
  const s = new THREE.Vector3();
  matrix.decompose(p, q, s);

  // Anchor zit op het oppervlak; kubus moet half zijn hoogte omhoog.
  p.y += CUBE_SIZE_M / 2;

  cubeGroup.position.copy(p);
  cubeGroup.quaternion.identity();
  cubeGroup.scale.set(1, 1, 1);
}

function onFrame(time, frame) {
  if (frame && session) {
    const refSpace = renderer.xr.getReferenceSpace();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace("viewer")
        .then(viewerSpace => session.requestHitTestSource({ space: viewerSpace }))
        .then(source => {
          hitTestSource = source;
        })
        .catch(err => {
          setStatus("Hit-test fout: " + err.message);
        });

      hitTestSourceRequested = true;
    }

    if (anchorSpace && cubeGroup) {
      updateAnchoredCube(frame, refSpace);
    }

    if (!placed && hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);

      if (hits.length > 0) {
        lastHitResult = hits[0];

        const pose = lastHitResult.getPose(refSpace);
        if (pose) {
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
          setStatus("Oppervlak gevonden. Tik om 5 cm kubus te ankeren.");
        }
      } else {
        lastHitResult = null;
        reticle.visible = false;
        setStatus("Beweeg rustig over de vloer…");
      }
    }
  }

  renderer.render(scene, camera);
}

startBtn.addEventListener("click", async () => {
  try {
    if (!renderer) initThree();

    session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test"],
      optionalFeatures: ["anchors", "local-floor", "dom-overlay"],
      domOverlay: { root: document.body }
    });

    await renderer.xr.setSession(session);

    startBtn.style.display = "none";
    ui.style.display = "none";
    setStatus("Beweeg rustig over de vloer…");

    session.addEventListener("end", () => {
      if (anchor && typeof anchor.delete === "function") {
        try { anchor.delete(); } catch (_) {}
      }

      session = null;
      hitTestSource = null;
      hitTestSourceRequested = false;
      lastHitResult = null;
      anchor = null;
      anchorSpace = null;
      fallbackPose = null;
      placed = false;

      if (reticle) reticle.visible = false;

      if (cubeGroup) {
        scene.remove(cubeGroup);
        cubeGroup = null;
      }

      startBtn.style.display = "";
      ui.style.display = "";
      setStatus("AR gestopt.");
    }, { once: true });

  } catch (err) {
    setStatus(err.name + ": " + err.message);
  }
});

addEventListener("resize", () => {
  if (!renderer || !camera) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

checkXR();
</script>
</body>
</html>
