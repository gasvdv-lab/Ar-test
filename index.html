<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>AR Test Diagnose v0.1.2</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#111; color:#fff; padding:18px; }
  main { max-width:800px; margin:0 auto; }
  h1 { margin:0 0 8px; font-size:30px; }
  .version { opacity:.7; margin-bottom:18px; }
  .card { background:#1c1c1c; border:1px solid #444; border-radius:14px; padding:14px; margin:14px 0; }
  .row { display:grid; grid-template-columns:1fr auto; gap:12px; padding:10px 0; border-bottom:1px solid #333; }
  .row:last-child { border-bottom:0; }
  .ok { color:#70e27f; font-weight:700; }
  .bad { color:#ff7777; font-weight:700; }
  .warn { color:#ffd36b; font-weight:700; }
  button { width:100%; min-height:54px; margin:8px 0; border-radius:10px; border:1px solid #666; font-weight:700; font-size:17px; }
  #run { background:#fff; color:#111; }
  #start { background:#2d7df6; color:#fff; }
  #start:disabled { opacity:.4; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#000; padding:14px; border-radius:12px; min-height:180px; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>AR Test — Diagnose</h1>
  <div class="version">v0.1.2 — volledig inline, geen modules</div>
  <div class="card">
    <div id="results">Pagina geladen. Diagnose start…</div>
  </div>
  <button id="run" type="button">TEST IMMERSIVE AR</button>
  <button id="start" type="button" disabled>START AR</button>
  <pre id="log">Script gestart…</pre>
</main>

<script>
(function () {
  var results = document.getElementById('results');
  var logEl = document.getElementById('log');
  var runBtn = document.getElementById('run');
  var startBtn = document.getElementById('start');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function log(msg) {
    var t = new Date().toLocaleTimeString();
    logEl.textContent += "\n[" + t + "] " + msg;
  }

  function row(label, value, cls) {
    return '<div class="row"><div>' + esc(label) + '</div><div class="' + cls + '">' + esc(value) + '</div></div>';
  }

  window.onerror = function(message, source, lineno, colno, error) {
    log("WINDOW ERROR: " + message + " @ " + lineno + ":" + colno);
    results.innerHTML += row("JavaScript-fout", message, "bad");
  };

  window.onunhandledrejection = function(ev) {
    var reason = ev && ev.reason ? (ev.reason.name + ": " + ev.reason.message) : "Onbekende Promise-fout";
    log("UNHANDLED REJECTION: " + reason);
    results.innerHTML += row("Promise-fout", reason, "bad");
  };

  async function diagnose() {
    results.innerHTML = "";
    startBtn.disabled = true;

    try {
      results.innerHTML += row("JavaScript actief", "JA", "ok");
      results.innerHTML += row("HTTPS / secure context", window.isSecureContext ? "JA" : "NEE", window.isSecureContext ? "ok" : "bad");
      results.innerHTML += row("Protocol", location.protocol, location.protocol === "https:" ? "ok" : "bad");

      var hasXR = !!navigator.xr;
      results.innerHTML += row("navigator.xr aanwezig", hasXR ? "JA" : "NEE", hasXR ? "ok" : "bad");

      var canvas = document.createElement("canvas");
      var gl = null;
      try { gl = canvas.getContext("webgl2"); } catch(e) {}
      results.innerHTML += row("WebGL2 beschikbaar", gl ? "JA" : "NEE", gl ? "ok" : "bad");

      results.innerHTML += row("User agent", navigator.userAgent, "warn");

      if (!hasXR) {
        results.innerHTML += row("immersive-ar ondersteund", "NIET BESCHIKBAAR", "bad");
        log("navigator.xr ontbreekt.");
        return;
      }

      log('Test isSessionSupported("immersive-ar")…');
      var supported = await navigator.xr.isSessionSupported("immersive-ar");
      results.innerHTML += row("immersive-ar ondersteund", supported ? "JA" : "NEE", supported ? "ok" : "bad");

      if (supported) {
        startBtn.disabled = false;
        log("immersive-ar = JA");
      } else {
        log("immersive-ar = NEE");
      }
    } catch (e) {
      var msg = (e && e.name ? e.name : "Error") + ": " + (e && e.message ? e.message : String(e));
      results.innerHTML += row("Diagnosefout", msg, "bad");
      log("DIAGNOSEFOUT: " + msg);
    }
  }

  runBtn.addEventListener("click", function() {
    log("TEST-knop ingedrukt.");
    diagnose();
  });

  startBtn.addEventListener("click", async function() {
    log("START AR ingedrukt.");
    try {
      var session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["local-floor"]
      });
      log("SUCCES: immersive-ar sessie gestart.");
      alert("AR-sessie gestart. Sluit deze melding en kijk of de camera/AR opent.");
      session.addEventListener("end", function(){ log("AR-sessie beëindigd."); });
    } catch (e) {
      var msg = (e && e.name ? e.name : "Error") + ": " + (e && e.message ? e.message : String(e));
      log("START AR FOUT: " + msg);
      alert("AR kon niet starten:\n" + msg);
    }
  });

  setTimeout(function() {
    log("Automatische diagnose gestart.");
    diagnose();
  }, 50);
})();
</script>
</body>
</html>
