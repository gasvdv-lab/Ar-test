<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>AR Kubus 5 cm</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101010;
    color: #fff;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  }
  #ui {
    position: fixed;
    z-index: 3;
    inset: 0 0 auto 0;
    padding: 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,.78), rgba(0,0,0,0));
    pointer-events: none;
  }
  h1 { margin: 0 0 6px; font-size: 24px; }
  p { margin: 4px 0; max-width: 760px; }
  #status {
    position: fixed;
    z-index: 4;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    max-width: calc(100vw - 36px);
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,.72);
    text-align: center;
    font-size: 14px;
    pointer-events: none;
  }
  #start {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    min-width: 180px;
    min-height: 52px;
    padding: 0 18px;
    border: 1px solid #666;
    border-radius: 10px;
    background: #fff;
    color: #111;
    font-weight: 700;
    font-size: 17px;
  }
  #start:disabled { opacity: .4; }
  canvas { display: block; }
</style>
</head>
<body>
  <div id="ui">
    <h1>AR Kubus — 5 cm</h1>
    <p>Exact 0,05 × 0,05 × 0,05 m.</p>
    <p>Start AR, beweeg rustig over de vloer en tik om de kubus te plaatsen. De app probeert een AR-anchor te gebruiken zodat de kubus zo stabiel mogelijk blijft staan.</p>
  </div>

  <div id="status">WebXR controleren…</div>
  <button id="start" disabled>START AR</button>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start");
const ui = document.getElementById("ui");

const CUBE_SIZE_M = 0.05;

let renderer, scene, camera, controller, reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let session = null;
let cubeGroup = null;
let placed = false;
let anchorSpace = null;

function setStatus(msg) {
  statusEl.textContent = msg;
  console.log(msg);
}

async function checkXR() {
  if (!navigator.xr) {
    setStatus("WebXR niet beschikbaar.");
    return;
  }
  try {
    const ok = await navigator.xr.isSessionSupported("immersive-ar");
    startBtn.disabled = !ok;
    setStatus(ok ? "AR beschikbaar. Druk op START AR." : "Immersive AR niet ondersteund.");
  } catch (e) {
    setStatus("WebXR-fout: " + e.message);
  }
}

function createCubeGroup() {
  const group = new THREE.Group();

  const geo = new THREE.BoxGeometry(CUBE_SIZE_M, CUBE_SIZE_M, CUBE_SIZE_M);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x1877f2,
    transparent: true,
    opacity: 0.86,
    roughness: 0.55
  });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0xffffff })
  );
  group.add(edges);

  return group;
}

function initThree() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType("local-floor");
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2.2));
  const dl = new THREE.DirectionalLight(0xffffff, 1.2);
  dl.position.set(1, 2, 1);
  scene.add(dl);

  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.03, 0.04, 48).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  controller = renderer.xr.getController(0);
  controller.addEventListener("select", onSelect);
  scene.add(controller);

  renderer.setAnimationLoop(onFrame);
}

async function onSelect() {
  if (!reticle.visible) {
    setStatus("Nog geen oppervlak gevonden.");
    return;
  }

  // Plaatsing gebeurt maar één keer per sessie.
  if (placed) {
    setStatus("Kubus staat al geplaatst en blijft op zijn plaats.");
    return;
  }

  const p = new THREE.Vector3();
  const q = new THREE.Quaternion();
  const s = new THREE.Vector3();
  reticle.matrix.decompose(p, q, s);

  cubeGroup = createCubeGroup();
  cubeGroup.position.copy(p);
  cubeGroup.position.y += CUBE_SIZE_M / 2;
  cubeGroup.quaternion.identity();
  scene.add(cubeGroup);

  placed = true;
  setStatus("Kubus geplaatst: 5 × 5 × 5 cm.");

  // De reticle mag verdwijnen na plaatsing.
  reticle.visible = false;

  // We vragen een anchor aan als dit beschikbaar is.
  tryCreateAnchor();
}

async function tryCreateAnchor() {
  if (!session) return;

  // Anchor API zit nog niet overal op dezelfde manier. We proberen veilig een anchor op basis
  // van de huidige kubuspose te maken als createAnchor beschikbaar is.
  try {
    const frame = renderer.xr.getFrame && renderer.xr.getFrame();
    const refSpace = renderer.xr.getReferenceSpace();

    if (!frame || !refSpace || !cubeGroup) {
      setStatus("Kubus geplaatst. Anchor niet beschikbaar, standaard tracking wordt gebruikt.");
      return;
    }

    if (typeof frame.createAnchor !== "function") {
      setStatus("Kubus geplaatst. Anchor API niet beschikbaar, standaard tracking wordt gebruikt.");
      return;
    }

    const transform = new XRRigidTransform(
      { x: cubeGroup.position.x, y: cubeGroup.position.y, z: cubeGroup.position.z },
      { x: 0, y: 0, z: 0, w: 1 }
    );

    const anchor = await frame.createAnchor(transform, refSpace);
    if (anchor && anchor.anchorSpace) {
      anchorSpace = anchor.anchorSpace;
      setStatus("Kubus geplaatst en geankerd.");
    } else {
      setStatus("Kubus geplaatst. Anchor kon niet worden vastgelegd.");
    }
  } catch (err) {
    setStatus("Kubus geplaatst. Anchor fout: " + err.message);
  }
}

function onFrame(t, frame) {
  if (frame && session) {
    const refSpace = renderer.xr.getReferenceSpace();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace("viewer")
        .then(viewerSpace => session.requestHitTestSource({ space: viewerSpace }))
        .then(source => {
          hitTestSource = source;
        })
        .catch(err => {
          setStatus("Hit-test fout: " + err.message);
        });
      hitTestSourceRequested = true;
    }

    // Als we een anchor hebben, volg exact de anchorpose.
    if (anchorSpace && cubeGroup) {
      const anchorPose = frame.getPose(anchorSpace, refSpace);
      if (anchorPose) {
        cubeGroup.matrix.fromArray(anchorPose.transform.matrix);
        cubeGroup.matrix.decompose(cubeGroup.position, cubeGroup.quaternion, cubeGroup.scale);
      }
    }

    // Alleen zolang de kubus nog niet geplaatst is, tonen we de reticle.
    if (!placed && hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);
      if (hits.length > 0) {
        const pose = hits[0].getPose(refSpace);
        if (pose) {
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
          setStatus("Oppervlak gevonden. Tik om de 5 cm kubus te plaatsen.");
        }
      } else {
        reticle.visible = false;
        setStatus("Beweeg rustig over de vloer…");
      }
    }
  }

  renderer.render(scene, camera);
}

startBtn.addEventListener("click", async () => {
  try {
    if (!renderer) initThree();

    session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test"],
      optionalFeatures: ["local-floor", "dom-overlay", "anchors"],
      domOverlay: { root: document.body }
    });

    renderer.xr.setSession(session);
    startBtn.style.display = "none";
    ui.style.display = "none";
    setStatus("Beweeg rustig over de vloer…");

    session.addEventListener("end", () => {
      session = null;
      hitTestSource = null;
      hitTestSourceRequested = false;
      anchorSpace = null;
      placed = false;

      if (reticle) reticle.visible = false;
      if (cubeGroup) {
        scene.remove(cubeGroup);
        cubeGroup = null;
      }

      startBtn.style.display = "";
      ui.style.display = "";
      setStatus("AR gestopt.");
    }, { once: true });

  } catch (e) {
    setStatus(e.name + ": " + e.message);
  }
});

addEventListener("resize", () => {
  if (!renderer || !camera) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

checkXR();
</script>
</body>
</html>
